<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Editor — HTML artifact generator</title>
<style>
/* Thariq HTML Effectiveness theme — extra-dense variant (https://thariqs.github.io/html-effectiveness/) */
:root {
  --ivory: #FAF9F5;
  --slate: #141413;
  --clay: #D97757;
  --clay-d: #B85C3E;
  --oat: #E3DACC;
  --olive: #788C5D;
  --rust: #B04A3F;
  --g50: #F0EEE6;
  --g200: #D1CFC5;
  --g500: #87867F;
  --g700: #3D3D3A;
  --paper: #FDFCF9;
  --serif: ui-serif, Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 7px;
  --gap: 6px;
  --pad: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  font-size: 12.5px;
  line-height: 1.38;
  background: var(--ivory);
  color: var(--g700);
  padding: 14px 10px 28px;
  -webkit-font-smoothing: antialiased;
}
.page { max-width: 1080px; margin: 0 auto; }
a { color: var(--clay); }
button, input, select, textarea { font: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: 2px solid var(--clay);
  outline-offset: 1px;
}
header { margin-bottom: 12px; max-width: 720px; }
.eyebrow {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--g500);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.eyebrow::before { content: ""; width: 12px; height: 1px; background: var(--clay); }
h1 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(19px, 2.6vw, 24px);
  line-height: 1.1;
  color: var(--slate);
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.lede { font-size: 12.5px; color: var(--g700); max-width: 640px; }
.lede strong { color: var(--slate); }
.muted { font-size: 11.5px; color: var(--g500); }
section { margin-bottom: 14px; scroll-margin-top: 8px; }
.sec-head {
  display: flex;
  align-items: baseline;
  gap: 7px;
  margin-bottom: 3px;
}
.sec-head .num {
  font-family: var(--mono);
  font-size: 9px;
  background: var(--oat);
  color: var(--slate);
  padding: 1px 5px;
  border-radius: 4px;
  flex-shrink: 0;
}
.sec-head h2 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 16px;
  color: var(--slate);
  letter-spacing: -0.01em;
}
.sec-intro { font-size: 12px; color: var(--g500); max-width: 600px; margin-bottom: 6px; }
.summary {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--gap);
  margin-bottom: 12px;
}
@media (max-width: 760px) { .summary { grid-template-columns: repeat(2, 1fr); } }
.summary .cell, .panel, .card {
  background: var(--paper);
  border: 1px solid var(--g200);
  border-radius: var(--radius);
}
.summary .cell { padding: 6px 8px; }
.summary .k {
  font-family: var(--mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--g500);
  margin-bottom: 1px;
}
.summary .v { font-size: 12px; color: var(--slate); font-weight: 600; }
.summary .v.accent { color: var(--clay); }
.panel { padding: var(--pad) 9px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--gap); }
.stack { display: grid; gap: var(--gap); }
h3 { font-family: var(--serif); font-weight: 500; font-size: 13px; color: var(--slate); }
table.data {
  width: 100%;
  border-collapse: collapse;
  background: var(--paper);
  border: 1px solid var(--g200);
  border-radius: var(--radius);
  overflow: hidden;
  font-size: 11.5px;
}
table.data th, table.data td {
  padding: 4px 7px;
  border-bottom: 1px solid var(--g200);
  text-align: left;
  vertical-align: top;
}
table.data th {
  background: var(--g50);
  font-family: var(--mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--g500);
}
table.data tr:last-child td { border-bottom: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid var(--g200);
  font-family: var(--mono);
  font-size: 10px;
  color: var(--slate);
  background: var(--paper);
  text-decoration: none;
}
.chip .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.chip.safe, .chip.low { background: rgba(120,140,93,0.10); border-color: rgba(120,140,93,0.4); }
.chip.safe .dot, .chip.low .dot { background: var(--olive); }
.chip.medium, .chip.med { background: var(--oat); }
.chip.medium .dot, .chip.med .dot { background: #B89B6E; }
.chip.attention, .chip.high { background: rgba(217,119,87,0.12); border-color: rgba(217,119,87,0.5); }
.chip.attention .dot, .chip.high .dot { background: var(--clay); }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
@media (max-width: 640px) { .compare { grid-template-columns: 1fr; } }
.compare article { background: var(--paper); border: 1px solid var(--g200); border-radius: var(--radius); padding: 7px 8px; }
.compare ul { margin: 4px 0 0; padding-left: 14px; font-size: 11.5px; }
.compare li { margin: 1px 0; }
.diagram {
  background: var(--paper);
  border: 1px solid var(--g200);
  border-radius: var(--radius);
  padding: 6px;
  overflow-x: auto;
}
.diagram svg { display: block; min-width: 560px; width: 100%; height: auto; color: var(--slate); }
.diagram text { font-family: var(--mono); font-size: 10px; fill: currentColor; }
.diagram .box { fill: var(--paper); stroke: currentColor; }
.caption { font-size: 10.5px; color: var(--g500); margin-top: 4px; }
.milestones { display: flex; flex-direction: column; }
.milestone {
  display: grid;
  grid-template-columns: 78px 18px 1fr;
  gap: 0 8px;
}
.milestone .when {
  text-align: right;
  font-family: var(--mono);
  font-size: 9.5px;
  color: var(--g500);
  padding-top: 1px;
}
.milestone .dot-col { display: flex; flex-direction: column; align-items: center; }
.milestone .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--paper); border: 2px solid var(--clay); margin-top: 2px;
}
.milestone .line { width: 1.5px; flex: 1; background: var(--g200); margin: 2px 0; }
.milestone:last-child .line { display: none; }
.milestone .body { padding-bottom: 8px; }
.milestone .body p { font-size: 11.5px; color: var(--g500); margin-top: 1px; max-width: 520px; }
.tag {
  font-family: var(--mono);
  font-size: 9px;
  background: var(--g50);
  border: 1px solid var(--g200);
  border-radius: 4px;
  padding: 1px 5px;
  color: var(--g700);
}
details {
  background: var(--paper);
  border: 1px solid var(--g200);
  border-radius: var(--radius);
  padding: 6px 8px;
  font-size: 11.5px;
}
summary { cursor: pointer; font-weight: 600; color: var(--slate); }
details[open] summary { margin-bottom: 4px; }
.toolbar { display: flex; gap: 4px; flex-wrap: wrap; margin: 5px 0; align-items: center; }
.toolbar.sticky {
  position: sticky; top: 0; z-index: 5;
  background: var(--ivory); padding: 5px 0;
  border-bottom: 1px solid var(--g200); margin-bottom: 6px;
}
.toolbar .hint { font-family: var(--mono); font-size: 9px; color: var(--g500); }
.btn {
  font-family: var(--mono);
  font-size: 10px;
  border-radius: 999px;
  padding: 4px 9px;
  cursor: pointer;
  border: 1px solid var(--slate);
  background: var(--slate);
  color: var(--ivory);
}
.btn.ghost { background: transparent; color: var(--slate); border-color: var(--g200); }
pre, code { font-family: var(--mono); }
pre.block {
  overflow-x: auto;
  background: var(--slate);
  color: #E8E6DC;
  border-radius: var(--radius);
  padding: 7px 9px;
  font-size: 10.5px;
  line-height: 1.45;
  white-space: pre-wrap;
}
pre.soft {
  background: var(--g50);
  border: 1px solid var(--g200);
  color: var(--g700);
  border-radius: var(--radius);
  padding: 7px 9px;
  font-size: 10.5px;
  line-height: 1.42;
  white-space: pre-wrap;
}
.tabs .tabbar { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 5px; }
.tabs .tabbar button {
  font-family: var(--mono);
  font-size: 10px;
  border: 1px solid var(--g200);
  background: var(--paper);
  color: var(--g700);
  border-radius: 999px;
  padding: 3px 8px;
  cursor: pointer;
}
.tabs .tabbar button[aria-selected="true"] {
  background: var(--slate);
  color: var(--ivory);
  border-color: var(--slate);
}
.search-bar { margin-bottom: 5px; }
.search-bar input {
  width: 100%;
  padding: 4px 7px;
  border: 1px solid var(--g200);
  border-radius: 5px;
  background: var(--paper);
  font-size: 11.5px;
}
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); border: 0;
}
.layout-2 {
  display: grid;
  grid-template-columns: 148px 1fr;
  gap: 10px;
  align-items: start;
}
@media (max-width: 760px) { .layout-2 { grid-template-columns: 1fr; } }
nav.jump { position: sticky; top: 6px; display: grid; gap: 2px; }
nav.jump a {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--g500);
  text-decoration: none;
  padding: 1px 0;
}
nav.jump a:hover { color: var(--slate); }
.pr-head {
  border: 1px solid var(--g200);
  border-radius: var(--radius);
  padding: 9px 10px;
  background: var(--paper);
  margin-bottom: 10px;
  max-width: none;
}
.file-card {
  border: 1px solid var(--g200);
  border-radius: var(--radius);
  background: var(--paper);
  overflow: hidden;
  margin-bottom: 6px;
  scroll-margin-top: 8px;
}
.file-head {
  padding: 5px 8px;
  border-bottom: 1px solid var(--g50);
  display: flex;
  justify-content: space-between;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}
.file-path { font-family: var(--mono); font-size: 11px; color: var(--slate); }
.file-note { padding: 5px 8px; font-size: 11.5px; color: var(--g500); }
.risk-tag {
  font-family: var(--mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 600;
}
.risk-tag.attention { background: rgba(217,119,87,0.15); color: var(--clay); }
.risk-tag.medium { background: var(--oat); color: #7A6A4F; }
.risk-tag.safe { background: rgba(120,140,93,0.15); color: var(--olive); }
.diff { background: var(--slate); font-family: var(--mono); font-size: 10px; line-height: 1.5; overflow-x: auto; }
.diff-row { display: grid; grid-template-columns: 32px 12px 1fr; padding: 0 6px 0 0; white-space: pre; }
.diff-row .ln { text-align: right; padding-right: 6px; color: var(--g500); }
.diff-row .code { color: #E8E6DC; }
.diff-row.add { background: rgba(120,140,93,0.15); }
.diff-row.add .mark { color: var(--olive); }
.diff-row.del { background: rgba(176,74,63,0.15); }
.diff-row.del .mark { color: var(--rust); }
.cols {
  display: grid;
  grid-template-columns: minmax(220px, 280px) 1fr;
  gap: 10px;
  align-items: start;
}
@media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
.field { display: grid; gap: 2px; margin-bottom: 5px; }
.field label { font-size: 11px; font-weight: 600; color: var(--slate); }
.field input, .field select, .field textarea {
  width: 100%;
  border: 1px solid var(--g200);
  border-radius: 5px;
  padding: 4px 6px;
  background: var(--paper);
  font-size: 11.5px;
}
.field textarea { min-height: 42px; resize: vertical; }
.field-check { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; font-size: 11.5px; }
.field-check input { width: auto; }
.warn {
  display: none;
  font-size: 11px;
  padding: 4px 6px;
  border-radius: 5px;
  border: 1px solid rgba(217,119,87,0.4);
  background: rgba(217,119,87,0.1);
  color: var(--clay-d);
}
.warn.visible { display: block; }
.preview-title {
  font-family: var(--serif);
  font-size: 15px;
  margin-bottom: 5px;
}
.visually-hidden {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); border: 0;
}
@media print {
  body { padding: 0; }
  .toolbar, .tabbar, .search-bar, nav.jump { display: none; }
  .tabs [hidden] { display: block !important; }
}

</style>
</head>
<body>
<main class="page">
<header>
<p class="eyebrow">Custom editor</p>
<h1>HTML Artifact Prompt Builder</h1>
<p class="lede"><strong>TL;DR:</strong> Tune type, audience, constraints — copy a paste-ready agent prompt.</p>
</header>
<div class="toolbar sticky"><span class="hint">LIVE · edits re-render</span></div>
<section class="cols">
<form class="panel" id="editor" aria-label="Prompt controls">
<div class="field"><label for="artifact-type">Artifact type</label>
<select id="artifact-type"><option>implementation plan</option><option>code review pack</option><option>architecture explainer</option><option>decision brief</option><option>incident report</option><option>custom editor</option></select></div>
<div class="field"><label for="audience">Reader</label><input id="audience" type="text" value="Implementing engineer"></div>
<div class="field"><label for="topic">Topic</label><textarea id="topic">Add a samples gallery to effective-html with Thariq-themed dense reference artifacts.</textarea></div>
<div class="field"><label for="sections">Sections</label><input id="sections" type="text" value="TL;DR, summary strip, diagram, risks, copy handoff"></div>
<div class="field"><label for="export-format">Export</label><select id="export-format"><option>Markdown handoff</option><option>JSON summary</option><option>Patch-like diff</option></select></div>
<div class="field-check"><input type="checkbox" id="no-cdn" checked><label for="no-cdn">Inline assets only (no CDN)</label></div>
<p class="warn" id="validation-warning" role="status">Add a topic.</p>
<button class="btn ghost" type="button" id="reset">Reset</button>
</form>
<div class="panel">
<h2 class="preview-title">Preview</h2>
<div class="chips" id="preview-meta" aria-live="polite" style="margin-bottom:5px"></div>
<div class="toolbar"><button class="btn" type="button" data-copy="#prompt-output">Copy prompt</button><button class="btn ghost" type="button" data-copy="#json-output">Copy JSON</button></div>
<pre class="block" id="prompt-output" aria-live="polite"></pre>
<pre class="visually-hidden" id="json-output"></pre>
</div>
</section>
</main>
<script>
async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    await navigator.clipboard.writeText(text);
    return;
  }
  const textarea = document.createElement("textarea");
  textarea.value = text;
  textarea.setAttribute("readonly", "");
  textarea.style.position = "fixed";
  textarea.style.top = "-1000px";
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand("copy");
  textarea.remove();
}

document.querySelectorAll("[data-copy]").forEach((button) => {
  button.addEventListener("click", async () => {
    const target = document.querySelector(button.dataset.copy);
    await copyText(target ? target.textContent.trim() : "");
    const previous = button.textContent;
    button.textContent = "Copied";
    setTimeout(() => { button.textContent = previous; }, 1200);
  });
});

function initTabs(root) {
  const tabs = [...root.querySelectorAll("[data-tab]")];
  const panels = [...root.querySelectorAll("[data-panel]")];
  if (!tabs.length) return;

  function selectTab(tab, focusTab = true) {
    const id = tab.dataset.tab;
    tabs.forEach((item) => {
      const selected = item === tab;
      item.setAttribute("aria-selected", String(selected));
      item.tabIndex = selected ? 0 : -1;
    });
    panels.forEach((panel) => {
      panel.hidden = panel.dataset.panel !== id;
    });
    if (focusTab) tab.focus({ preventScroll: true });
  }

  tabs.forEach((tab, index) => {
    const id = tab.dataset.tab;
    tab.id = `tab-${id}`;
    tab.tabIndex = index === 0 ? 0 : -1;
    tab.setAttribute("aria-controls", `panel-${id}`);
    const panel = panels.find((item) => item.dataset.panel === id);
    if (panel) {
      panel.id = `panel-${id}`;
      panel.setAttribute("role", "tabpanel");
      panel.setAttribute("aria-labelledby", tab.id);
    }
    tab.addEventListener("click", () => selectTab(tab));
    tab.addEventListener("keydown", (event) => {
      const current = tabs.indexOf(tab);
      if (event.key === "ArrowRight") {
        event.preventDefault();
        selectTab(tabs[Math.min(current + 1, tabs.length - 1)]);
      }
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        selectTab(tabs[Math.max(current - 1, 0)]);
      }
    });
  });
  selectTab(tabs[0], false);
}

document.querySelectorAll("[data-tabs]").forEach(initTabs);

document.getElementById("family-search")?.addEventListener("input", (event) => {
  const query = event.target.value.toLowerCase().trim();
  document.querySelectorAll(".searchable-row").forEach((row) => {
    row.style.display = row.textContent.toLowerCase().includes(query) ? "" : "none";
  });
});

const defaults = {
  artifactType: "implementation plan",
  audience: "Implementing engineer",
  topic: "Add a samples gallery to effective-html with Thariq-themed dense reference artifacts.",
  sections: "TL;DR, summary strip, diagram, risks, copy handoff",
  exportFormat: "Markdown handoff",
  noCdn: true,
};

const els = {
  form: document.getElementById("editor"),
  artifactType: document.getElementById("artifact-type"),
  audience: document.getElementById("audience"),
  topic: document.getElementById("topic"),
  sections: document.getElementById("sections"),
  exportFormat: document.getElementById("export-format"),
  noCdn: document.getElementById("no-cdn"),
  warning: document.getElementById("validation-warning"),
  meta: document.getElementById("preview-meta"),
  prompt: document.getElementById("prompt-output"),
  json: document.getElementById("json-output"),
  reset: document.getElementById("reset"),
};

function readState() {
  return {
    artifactType: els.artifactType.value,
    audience: els.audience.value.trim(),
    topic: els.topic.value.trim(),
    sections: els.sections.value.trim(),
    exportFormat: els.exportFormat.value,
    noCdn: els.noCdn.checked,
  };
}

function buildPrompt(state) {
  const constraints = [
    state.noCdn ? "Inline CSS/SVG/JS only." : "CDN allowed if needed.",
    "Start from base.html.",
    "TL;DR above the fold.",
    `Include: ${state.sections || "standard sections"}.`,
    `Export: ${state.exportFormat}.`,
    "Run check-html-artifact.py.",
  ];
  return [
    "Use create-html-artifacts (effective-html).",
    "",
    `Create HTML ${state.artifactType} for: ${state.topic || "[topic required]"}`,
    "",
    `Reader: ${state.audience || "Unspecified"}`,
    "",
    "Constraints:",
    ...constraints.map((line) => `- ${line}`),
    "",
    "Deliver one portable .html file.",
  ].join("\n");
}

function renderPromptEditor() {
  const state = readState();
  els.warning.classList.toggle("visible", !state.topic);
  els.meta.innerHTML = [
    state.artifactType,
    state.exportFormat,
    state.noCdn ? "inline only" : "CDN ok",
  ].map((label) => `<span class="chip">${label}</span>`).join("");
  els.prompt.textContent = buildPrompt(state);
  els.json.textContent = JSON.stringify(
    { skill: "create-html-artifacts", ...state, inlineOnly: state.noCdn },
    null,
    2,
  );
}

els.form.addEventListener("submit", (event) => event.preventDefault());
els.form.addEventListener("input", renderPromptEditor);
els.reset.addEventListener("click", () => {
  els.artifactType.value = defaults.artifactType;
  els.audience.value = defaults.audience;
  els.topic.value = defaults.topic;
  els.sections.value = defaults.sections;
  els.exportFormat.value = defaults.exportFormat;
  els.noCdn.checked = defaults.noCdn;
  renderPromptEditor();
});
renderPromptEditor();
</script>
</body>
</html>
